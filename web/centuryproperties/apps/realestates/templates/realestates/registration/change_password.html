{% load static %}
<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css" integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO" crossorigin="anonymous">
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/js/bootstrap.min.js" integrity="sha384-ChfqqxuZUCnJSK3+MXmPNIyE6ZbWh2IMqE241rYiqJxyMiZ6OW/JmZQ5stwEULTy" crossorigin="anonymous"></script>
     <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.3.0/font/bootstrap-icons.css" />
    <title>Change Password</title>
    <style>
        form i {
            cursor: pointer;
        }
    </style>
</head>
<body>


<div class="container bg-dark" style="color:white">
    <form class="form" method="post">
        {% csrf_token %}
        <h4>Change Password:</h4>
        {% if messages %}
        <div>
          <strong>Messages:</strong>
          <ul>
            {% for message in messages %}
              {{message}}
            {% endfor %}
          </ul>
        </div>
         {% endif %}
        <div class="form-outline mb-4">
            <label  style="margin-right:20px">Enter old password</label><br>
            {{ form.old_password }}
            <i class="bi bi-eye-slash" id="togglePassword1"></i>
            <label for="togglePassword1" style="margin-right:20px;color:red">Show Password</label>
        </div>
        <div class="form-outline mb-4">
            <label  style="margin-right:20px">Enter new password</label><br>
            {{ form.new_password1 }}

            <i class="bi bi-eye-slash" id="togglePassword2"></i>
            <label for="togglePassword2" style="margin-right:20px;color:red">Show Password</label>
        </div>

        <div class="form-outline mb-4">
            <label  style="margin-right:20px">Confirm new password</label><br>
            {{ form.new_password2 }}
            <i class="bi bi-eye-slash" id="togglePassword3"></i>
            <label for="togglePassword3" style="margin-right:20px;color:red">Show Password</label>
        </div>

        <input type="submit" value="Save" style="cursor:pointer">
        <input type="button" value="Cancel" style="color:red;cursor:pointer" onclick="window.history.go(-1);"/>
        <!-- <a class="text-muted" href="url 'mirai:account_reset_password'">Forgot password?</a> -->
    </form>
</div>


 <script>
        const togglePassword = document.querySelector("#togglePassword1");
        const password =  document.getElementById("id_old_password");

        togglePassword.addEventListener("click", function () {
            // toggle the type attribute
            const type = password.getAttribute("type") === "password" ? "text" : "password";
            password.setAttribute("type", type);

            // toggle the icon
            this.classList.toggle("bi-eye");
        });


        const togglePassword2 = document.querySelector("#togglePassword2");
        const password2 =  document.getElementById("id_new_password1");

        togglePassword2.addEventListener("click", function () {
            // toggle the type attribute
            const type = password2.getAttribute("type") === "password" ? "text" : "password";
            password2.setAttribute("type", type);

            // toggle the icon
            this.classList.toggle("bi-eye");
        });


        const togglePassword3 = document.querySelector("#togglePassword3");
        const password3 =  document.getElementById("id_new_password2");

        togglePassword3.addEventListener("click", function () {
            // toggle the type attribute
            const type = password3.getAttribute("type") === "password" ? "text" : "password";
            password3.setAttribute("type", type);

            // toggle the icon
            this.classList.toggle("bi-eye");
        });

        // prevent form submit
        const form = document.querySelector("form");
        form.addEventListener('submit', function (e) {
            //e.preventDefault();
        });
 </script>

</body>
</html>
