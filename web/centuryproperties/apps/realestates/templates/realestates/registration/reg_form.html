{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Dashboard</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css" integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO" crossorigin="anonymous">
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/js/bootstrap.min.js" integrity="sha384-ChfqqxuZUCnJSK3+MXmPNIyE6ZbWh2IMqE241rYiqJxyMiZ6OW/JmZQ5stwEULTy" crossorigin="anonymous"></script>
    <script src='https://cdn.plot.ly/plotly-2.29.1.min.js'></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.3.0/font/bootstrap-icons.css" />
    <style>
        form i {
        margin-left: 0px;
        cursor: pointer;
    }
    </style>
</head>
<body>
    <div class="container bg-dark" style="color:white">
        <div class="dashboard-container">
            <div class="row mt-4 gradient-custom-2">
                <div class="col-md-12">
                    <div class="shadow p-4 wb-5 bg-body rounded" >
                        <h3 style="text-align:center">Register new Distributor</h3>
                        <form method="post">
                            {% csrf_token %}
                            <div class="form-outline mb-4">
                               <label>UserName:</label>
                               {{ form.username }}
                            </div>
                             <div class="form-outline mb-4">
                               <label>First Name:</label>
                               {{ form.first_name }}
                             </div>
                              <div class="form-outline mb-4">
                               <label>Last Name:</label>
                               {{ form.last_name }}
                              </div>
                               <div class="form-outline mb-4">
                               <label>Email:</label>
                               {{ form.email }}
                               </div>
                                <div class="form-outline mb-4">
                                 <label>Password:</label>
                                {{ form.password1 }}
                                   <i class="bi bi-eye-slash" id="togglePassword1"></i>
                                   <label for="togglePassword1" style="color:red">Show Password</label>
                               </div>
                                <div class="form-outline mb-4">
                                <label>Confirm Password:</label>
                                {{ form.password2 }}
                                   <i class="bi bi-eye-slash" id="togglePassword2"></i>
                                    <label for="togglePassword2" style="color:red">Show Password</label>
                               </div>
                            <button class="btn-success btn-badge" type="submit">Submit</button>
                            <input type="button" value="Cancel" class="btn-danger btn-badge" onclick="window.history.go(-1);"/>
                        </form>
                    </div>
                </div>

            </div>
        </div>
    </div>
<script>
        const togglePassword1 = document.querySelector("#togglePassword1");
        const password1 =  document.getElementById("id_password1");
        togglePassword1.addEventListener("click", function () {
            // toggle the type attribute
            const type = password1.getAttribute("type") === "password" ? "text" : "password";
            password1.setAttribute("type", type);
            // toggle the icon
            this.classList.toggle("bi-eye");
        });

        const togglePassword2 = document.querySelector("#togglePassword2");
        const password2 =  document.getElementById("id_password2");
        togglePassword2.addEventListener("click", function () {
            // toggle the type attribute
            const type = password2.getAttribute("type") === "password" ? "text" : "password";
            password2.setAttribute("type", type);
            // toggle the icon
            this.classList.toggle("bi-eye");
        });

        // prevent form submit
        const form = document.querySelector("form");
        form.addEventListener('submit', function (e) {
            //e.preventDefault();
        });
</script>
</body>
</html>
