{% load static %}
<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    
     <title>Edit User Profile</title>
</head>
<body>

<div class="container">
    <form action="" method="post" enctype="multipart/form-data" style="background-color:lightblue;">
        {% csrf_token %}
        <table>
        {{ user_form.as_table }}
        {{ profile_form.as_table }}
        </table>
        <b><input type="submit" value="Update" style="color:blue;cursor:pointer" />
        <input type="button" value="Cancel" style="color:red;cursor:pointer"
                  onclick="window.history.go(-1);"/></b>
    </form>
</div>

</body>
</html>
