{% load static %}
{% load custom_filters %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Dashboard</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css" integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO" crossorigin="anonymous">
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/js/bootstrap.min.js" integrity="sha384-ChfqqxuZUCnJSK3+MXmPNIyE6ZbWh2IMqE241rYiqJxyMiZ6OW/JmZQ5stwEULTy" crossorigin="anonymous"></script>
    <script src='https://cdn.plot.ly/plotly-2.29.1.min.js'></script>
    <script src="{% static 'assets/js/jquery-3.4.1.min.js' %}"></script>

</head>
<body>
    <div class="container bg-dark" style="color:white">
        <div class="dashboard-container">
            <div class="row mt-2">
                <div class="col-md-12">
                    <div class="shadow p-2 wb-5 bg-body rounded" >

                    </div>
                </div>

            </div>
            <div class="row mt-2">
                <div class="col-md-12">
                        <div class="shadow  wb-5 bg-body rounded" >
                            <h3 style="margin-bottom:15px">Installment List</span></h3>
                            <input style="margin-right:1100px" size="40" type="number" id="searchInput" placeholder="client phone number...">
                            <div class="table-responsive" style="max-height: 300px; overflow-y: auto;">
                                <table class="table table-striped table-dark search-table">
                                      <thead>
                                        <tr class="text-success">
                                            <th scope="col">Contact</th>
                                            <th scope="col">Balance</th>
                                            <th scope="col">Payment</th>
                                        </tr>
                                      </thead>
                                      <tbody class="text-white">
                                        {% for payment in clients_with_pending_payments %}
                                               <tr>
                                                   <td>{{ payment.client.phoneNumber1 }}</td>
                                                    <td>{{ payment.remaining_amount|add_commas }}</td>
                                                     <td>
                                                        <form action="{% url 'realestates:approve_payment' payment.id %}" method="post">
                                                            {% csrf_token %}
                                                            <button class="btn btn-sm btn-primary" type="submit">Approve</button>
                                                        </form>
                                                     </td>
                                               </tr>
                                        {% endfor %}
                                      </tbody>
                                </table>
                                <input type="button" value="Cancel" class="btn-danger btn-badge" onclick="window.history.go(-1);"/>
                            </div>
                        </div>
                    </div>
            </div>
        </div>
    </div>

    <script>
    function formatAmount(input) {
        // Remove existing commas and non-numeric characters from the input
        let value = input.value.replace(/[^\d]/g, '');

        // Add commas to the value
        value = value.replace(/\B(?=(\d{3})+(?!\d))/g, ',');

        // Update the input value
        input.value = value;
    }
    </script>

    <script>
    $(document).ready(function() {
        $('#searchInput').on('keyup', function() {
            var searchText = $(this).val().toLowerCase();
            $(this).closest('.shadow').find('.search-table tbody tr').filter(function() {
                $(this).toggle($(this).text().toLowerCase().indexOf(searchText) > -1);
            });
        });
    });
    </script>
</body>
</html>
