<div class="content-wrapper">
  <!-- Content -->
  <div class="container-xxl flex-grow-1 container-p-y">

    <!-- Message Container for AJAX responses -->
    <div id="messageContainer" class="mt-3"></div>

    <!-- Search Bar -->
    <div class="input-group">
       <input type="text" id="search_distributor" class="form-control custom-border"
          placeholder="Search distributor name..."  name="search">
        <button onclick="search_distributor(event)" data-page="distributors" class="btn btn-outline-dark" type="submit">Search</button>
    </div>

    <div class="clients-grid">
        {% for employee in employees_list %}
        <div id="distributor-{{ employee.id }}" class="client-card border rounded p-2 mb-2 bg-white">
            <div class="client-info">
                <div class="client-date text-muted">Total Clients: {{ employee.total_clients }}</div>
                <div class="client-name text-dark"> {{ employee.user.get_full_name }}</div>
                <div class="client-name text-dark">{{ employee.user.email }}</div>
                <div class="client-contact text-secondary">{{ employee.phone }}</div>
            </div>
            <div class="client-action">
                <button onclick="deleteDistributor(event, {{ employee.id }})" class="btn btn-sm btn-danger">Delete Distributor</button>
            </div>
        </div>
        {% endfor %}
    </div>
  </div>
</div>
