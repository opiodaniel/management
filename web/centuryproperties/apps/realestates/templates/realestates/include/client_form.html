<div class="container-xxl flex-grow-1 container-p-y">
    <!-- Basic Layout & Basic with Icons -->
    <div class="row">
      <!-- Basic with Icons -->
      <div class="col-xxl">
        <div class="card mb-6">
          <div class="card-header d-flex align-items-center justify-content-between">
            <h5 class="mb-0">Client Form</h5> <small class="text-muted float-end">Merged input group</small>
          </div>
          <div class="card-body">
            <div id="success"></div>
            <div id="errors"></div>
            <form id="add-client-form" method="post" action="{% url 'realestates:admin_add_client' %}">
              {% csrf_token %}
              <div class="row mb-6">
                <label class="col-sm-2 col-form-label" for="basic-icon-default-fullname">Name</label>
                <div class="col-sm-10">
                  <div class="input-group input-group-merge">
                    <span id="basic-icon-default-fullname2" class="input-group-text"><i class="fa fa-user" style="font-weight:bold;font-size:18px" aria-hidden="true"></i></span>
                    {{ admin_client_form.name }}
                  </div>
                </div>
              </div>
              <div class="row mb-6">
                <label class="col-sm-2 col-form-label" for="basic-icon-default-company">PhoneNo1</label>
                <div class="col-sm-10">
                  <div class="input-group input-group-merge">
                    <span id="basic-icon-default-company2" class="input-group-text"><i class="fa fa-phone" style="font-weight:bold" aria-hidden="true"></i></span>
                    {{ admin_client_form.phoneNumber1 }}
                  </div>
                </div>
              </div>
              <div class="row mb-6">
                <label class="col-sm-2 col-form-label" for="basic-icon-default-email">PhoneNo2</label>
                <div class="col-sm-10">
                  <div class="input-group input-group-merge">
                    <span class="input-group-text"><i class="fa fa-phone" style="font-weight:bold" aria-hidden="true"></i></span>
                    {{ admin_client_form.phoneNumber2 }}
                    <span id="basic-icon-default-email2" class="input-group-text">07xx</span>
                  </div>
                  <div class="form-text"> You can use numbers &amp; only </div>
                </div>
              </div>
              <div class="row mb-6">
                <label class="col-sm-2 col-form-label" for="basic-icon-default-phone">Location</label>
                <div class="col-sm-10">
                  <div class="input-group input-group-merge">
                    <span id="basic-icon-default-phone2" class="input-group-text"><i class="fa fa-map-marker" style="font-weight:bold;font-size:20px" aria-hidden="true"></i></span>
                      {{ admin_client_form.location }}
                  </div>
                </div>
              </div>
              <div class="row mb-6">
                <label class="col-sm-2 col-form-label" for="{{ admin_client_form.employee.id_for_label }}">Distribut</label>
                <div class="col-sm-10">
                  <div class="input-group input-group-merge">
                    <span id="basic-icon-default-message2" class="input-group-text"><i class="fa fa-users" style="font-weight:bold;font-size:12px" aria-hidden="true"></i></span>
                    {{ admin_client_form.employee }}
                  </div>
                </div>
              </div>
              <div class="row justify-content-end">
                <div class="col-sm-10 mt-1">
                  <button type="submit" class="btn btn-primary">Send</button>
                </div>
              </div>
            </form>
          </div>
        </div>
      </div>
      <!-- Basic Layout -->
      <div class="col-xxl"></div>
    </div>
</div>

<script>
  $(document).ready(function() {
    $('#add-client-form').on('submit', function(event) {
      event.preventDefault(); // Prevent form from submitting normally
      var form = $(this);
      var formData = form.serialize(); // Collect form data
      var url = form.attr('action')
      $.ajax({
        url: form.attr('action'), // Form action URL (where the form is being submitted)
        type: 'POST',
        data: formData,
        dataType: 'json',
        success: function(response) {
          if (response.success) {
            $('#success').html('<div class="alert alert-success">' + response.message + '</div>');
            $('#errors').html(''); // Clear previous errors
            form[0].reset(); // Reset the form on success
          } else {
            $('#errors').html('<div class="alert alert-danger">' + response.error + '</div>');
          }
        },
        error: function(xhr, status, error) {
          $('#errors').html('<div class="alert alert-danger">An error occurred. Please try again.</div>');
        }
      });
    });
  });
</script>
