            table {
                        width: 100%;
                        border-collapse: collapse;
                    }

                    th, td {
                        padding: 8px;
                        border: 1px solid black;
                    }

                    /* Truncate long text and display ellipsis */
                    .truncate {
                        white-space: nowrap;
                        overflow: hidden;
                        text-overflow: ellipsis;
                    }

                    /* Responsive styles */
                    @media screen and (max-width: 600px) {
                        th, td {
                            padding: 4px;
                        }

                        .truncate {
                                max-width: 90px; /* Adjust max-width as needed */
                            }
                    }
